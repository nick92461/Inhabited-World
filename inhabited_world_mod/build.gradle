plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"inhabited_world" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		client {
			// Fixed dev identity: the offline UUID is derived from the username, so test worlds
			// keep the same player across launches (canon 08 §51).
			programArgs "--username", "Dev"
		}

		// The one-click test launch (test-launch.bat at the workspace root, canon 10 §60 Testing Workflow):
		// the dev client opens straight into a fresh test world. Only this run sets the property, so the
		// shipped mod never creates a world on its own. -PtestWorld=default makes a same-seed Default world.
		testClient {
			inherit loom.runs.client
			configName = "Minecraft Client (fresh test world)"
			property "inhabited_world.dev.testWorld", providers.gradleProperty("testWorld").getOrElse("rpg")
		}
	}
}

// Headless game tests (Fabric GameTest). They live in their own source set and test-only mod
// (src/gametest/, mod ID inhabited_world_gametest), which never ships. `check` (and so `build`)
// runs them through the runGameTest task.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "inhabited_world_gametest"
		enableClientGameTests = false
	}
}

loom.runs.named("gameTest") {
	// JUnit-style XML report of the game tests, for CI.
	property "fabric-api.gametest.report-file", layout.buildDirectory.file("reports/gametest/gametest.xml").get().asFile.absolutePath
	// Each run creates a fresh Inhabited World, which pre-generates its whole map and ocean ring before the tests start.
	// Game tests pre-generate only the northernmost 14 chunk rows (the ocean ring and the map's northern edge) so
	// builds stay quick; -PpregenRows=all runs the whole thing.
	property "inhabited_world.dev.pregenRows", providers.gradleProperty("pregenRows").getOrElse("14")
	// The planner's multi-seed survey (PlannerGameTests) plans a few seeds in every build; -PplannerSeeds=250 plans
	// that many for each waterfront setting and writes build/reports/planner-survey.csv.
	if (providers.gradleProperty("plannerSeeds").isPresent()) {
		property "inhabited_world.dev.plannerSeeds", providers.gradleProperty("plannerSeeds").get()
	}
	property "inhabited_world.dev.reportDir", layout.buildDirectory.dir("reports").get().asFile.absolutePath
}

// Every game-test run starts from a freshly created world, as a player's new world would: world creation is what
// makes the WorldPlan and pre-generates the map, and no test may read chunks left over from an earlier build.
def gameTestWorld = layout.buildDirectory.dir("run/gameTest/world")
tasks.named("runGameTest") {
	doFirst {
		gameTestWorld.get().asFile.deleteDir()
	}
}

// The game-test server builds its world from the minecraft:flat_all_dimensions preset. The test mod
// replaces that preset with a copy of our shipped rpg_world preset, made at build time so the two can
// never drift apart: game tests then run inside a real Inhabited World.
tasks.named("processGametestResources", ProcessResources) {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") {
		expand "version": version
	}

	from("src/main/resources/data/inhabited_world/worldgen/world_preset/rpg_world.json") {
		into "data/minecraft/worldgen/world_preset"
		rename { "flat_all_dimensions.json" }
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Unit tests: JUnit 5 run inside Fabric Loader, so Minecraft classes and our mixins are available.
	testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
}

test {
	useJUnitPlatform()
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
